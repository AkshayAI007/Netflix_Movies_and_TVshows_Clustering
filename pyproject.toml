[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "netflix-recommender"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.2",
    "flask>=2.0",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.0",
    "streamlit>=1.30",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recommender*"]
